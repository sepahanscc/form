            { group: "ستاره دار ۹ خ ف خالقی", name: "سیاوش حاج هاشمی", natId: "1277199833", father: "محمدرضا", dob: "1392/12/22", phone: "09128337909" },
            { group: "ستاره دار ۹ خ ف خالقی", name: "محمد حسین کرمی", natId: "1278713808", father: "بهزاد", dob: "1397/04/17", phone: "09131651696" }
        ];

        // ساخت جدول
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const totalCountEl = document.getElementById('totalCount');
        const visibleCountEl = document.getElementById('visibleCount');
        const noResultEl = document.getElementById('noResult');

        // تبدیل اعداد به فارسی
        function toPersianNum(num) {
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return num.toString().replace(/\d/g, x => persianDigits[x]);
        }

        let currentGroup = '';
        let rowIndex = 0;

        function renderTable(data) {
            tableBody.innerHTML = '';
            currentGroup = '';
            rowIndex = 0;
            let visible = 0;

            if (data.length === 0) {
                noResultEl.style.display = 'block';
                visibleCountEl.textContent = toPersianNum(0);
                return;
            }
            noResultEl.style.display = 'none';

            data.forEach((player) => {
                // اگر گروه تغییر کرد، یک ردیف سرگروه اضافه کن
                if (player.group !== currentGroup) {
                    currentGroup = player.group;
                    const groupRow = document.createElement('tr');
                    groupRow.className = 'group-header';
                    groupRow.innerHTML = `<td colspan="6">${currentGroup}</td>`;
                    tableBody.appendChild(groupRow);
                }

                rowIndex++;
                visible++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="row-num">${toPersianNum(rowIndex)}</td>
                    <td class="name">${player.name}</td>
                    <td class="nat-id">${player.natId}</td>
                    <td>${player.father}</td>
                    <td>${player.dob}</td>
                    <td class="phone">${player.phone}</td>
                `;
                tableBody.appendChild(tr);
            });

            visibleCountEl.textContent = toPersianNum(visible);
        }

        // جستجوی زنده
        function filterData() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                renderTable(players);
                return;
            }

            const filtered = players.filter(p => {
                return (
                    p.name.toLowerCase().includes(query) ||
                    p.natId.toLowerCase().includes(query) ||
                    p.father.toLowerCase().includes(query) ||
                    p.dob.toLowerCase().includes(query) ||
                    p.phone.toLowerCase().includes(query) ||
                    p.group.toLowerCase().includes(query)
                );
            });

            renderTable(filtered);
        }

        // رندر اولیه
        renderTable(players);
        totalCountEl.textContent = toPersianNum(players.length);
        visibleCountEl.textContent = toPersianNum(players.length);

        // رویداد جستجو
        searchInput.addEventListener('input', filterData);
    </script>
</body>
